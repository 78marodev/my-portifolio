<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Login Access Portal</title>
    <!-- Load the official Google Identity Services script -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; background-color: #f4f6f9; margin: 0; }
        .login-box { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); text-align: center; width: 340px; box-sizing: border-box; }
        .profile-box { display: none; background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); text-align: center; width: 340px; box-sizing: border-box; }
        .profile-img { width: 80px; height: 80px; border-radius: 50%; margin-bottom: 15px; border: 3px solid #007bff; }
        h2 { color: #333; margin-top: 0; font-size: 24px; }
        p { color: #666; font-size: 14px; line-height: 1.5; }
        button { margin-top: 25px; padding: 12px 24px; background: #dc3545; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; transition: background 0.2s; }
        button:hover { background: #bd2130; }
        .error { color: #dc3545; font-weight: bold; margin-top: 15px; display: none; background: #f8d7da; padding: 10px; border-radius: 6px; border: 1px solid #f5c6cb; }
        .google-btn-container { display: flex; justify-content: center; margin-top: 20px; }
    </style>
</head>
<body>

    <!-- Access Portal Screen -->
    <div id="loginScreen" class="login-box">
        <h2>Access Portal</h2>
        <p>Sign in with your Google account to access the website.</p>
        
        <!-- Error Message Container -->
        <p id="errorMessage" class="error">Access Denied.<br>Your email is not authorized.</p>

        <!-- Google Sign-In Initialization using credentials from source file -->
        <div id="g_id_onload"
             data-client_id="550789292433-q69q7g88f65ovd1oqqv9e0g0m71kodbn.apps.googleusercontent.com"
             data-context="signin"
             data-ux_mode="popup"
             data-callback="handleCredentialResponse"
             data-auto_prompt="false">
        </div>

        <!-- Google Sign-In Button Interface -->
        <div class="google-btn-container">
            <div class="g_id_signin"
                 data-type="standard"
                 data-shape="rectangular"
                 data-theme="outline"
                 data-size="large"
                 data-logo_alignment="left">
            </div>
        </div>
    </div>

    <!-- Authorized Website Content Screen -->
    <div id="protectedScreen" class="profile-box">
        <img id="userImage" class="profile-img" src="" alt="User Profile">
        <h2 id="welcomeMessage">Access Granted!</h2>
        <p id="userEmail" style="font-weight: bold; color: #28a745;"></p>
        <p>You have successfully logged into the private zone.</p>
        <button onclick="logout()">Sign Out</button>
    </div>

    <script>
        // Decodes the secure JSON Web Token (JWT) provided by Google
        function parseJwt(token) {
            try {
                var base64Url = token.split('.');
                var base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
                var jsonPayload = decodeURIComponent(window.atob(base64).split('').map(function(c) {
                    return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
                }).join(''));
                return JSON.parse(jsonPayload);
            } catch (error) {
                console.error("Failed to parse identity token:", error);
                return null;
            }
        }

        // Processes authorization logic when a user interfaces with Google Sign-In
        function handleCredentialResponse(response) {
            const responsePayload = parseJwt(response.credential);
            const errorMessage = document.getElementById("errorMessage");

            if (!responsePayload) {
                errorMessage.innerText = "Authentication error. Try again.";
                errorMessage.style.display = "block";
                return;
            }

            // Enforces strict target email domain constraint setup earlier
            if (responsePayload.email === 'marinesp32dev@gmail.com') {
                errorMessage.style.display = "none";
                
                // Populates user telemetry to the DOM
                document.getElementById("userEmail").innerText = responsePayload.email;
                document.getElementById("userImage").src = responsePayload.picture;

                // Interface transition from Auth Gateway to Content Screen
                document.getElementById("loginScreen").style.display = "none";
                document.getElementById("protectedScreen").style.display = "block";
            } else {
                // Renders error container if identity context fails verification rule
                errorMessage.style.display = "block";
                google.accounts.id.disableAutoSelect(); 
            }
        }

        // Destroys interface persistence state on requested exit execution
        function logout() {
            document.getElementById("loginScreen").style.display = "block";
            document.getElementById("protectedScreen").style.display = "none";
            google.accounts.id.disableAutoSelect();
        }
    </script>
</body>
</html>
